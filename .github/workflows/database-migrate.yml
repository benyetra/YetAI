name: Database Migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: Railway target (production or staging)
        required: true
        type: choice
        options:
          - production
          - staging

jobs:
  migrate:
    name: Alembic upgrade (${{ inputs.target }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Run migrations (production)
        if: inputs.target == 'production'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POSTGRES_SERVICE_ID: 421f0104-94c9-478a-8f11-d19955df0d37
        run: |
          set -euo pipefail
          export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
          echo "DATABASE_URL resolved (host only): ${DATABASE_URL#*@}"
          echo "=== Before ==="
          alembic current
          echo "=== Upgrade ==="
          alembic upgrade head
          echo "=== After ==="
          alembic current
          python3 <<'PY'
          import os
          from sqlalchemy import create_engine, text
          e = create_engine(os.environ["DATABASE_URL"])
          with e.connect() as c:
              rev = c.execute(text("SELECT version_num FROM alembic_version")).scalar()
              n = c.execute(text(
                  "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'pred_wnba_%'"
              )).scalar()
              print("alembic_version:", rev)
              print("pred_wnba_* tables:", n)
          PY

      - name: Run migrations (staging)
        if: inputs.target == 'staging'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          POSTGRES_SERVICE_ID: 421f0104-94c9-478a-8f11-d19955df0d37
        run: |
          set -euo pipefail
          export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
          echo "DATABASE_URL resolved (host only): ${DATABASE_URL#*@}"
          echo "=== Before ==="
          alembic current
          echo "=== Upgrade ==="
          alembic upgrade head
          echo "=== After ==="
          alembic current
