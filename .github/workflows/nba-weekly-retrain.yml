name: NBA Weekly Retrain

# Keeps the NBA models learning from new games. Each model retrains on the last
# two seasons plus the current one and uploads only if it passes its own gate
# (props and residual models: the shared promote gate, i.e. line evidence, no worse
# than the stored line, and better than the live model beyond noise; spread: must
# beat Elo and the market line on the same holdout). The live model is
# archived before any replacement; roll back with scripts/ml_model_rollback.py.
# A gate outcome (rejected_by_champion, rejected_by_line_gate, no_line_evidence,
# gate_failed, below_baseline) is a green run with a notice; the live model stays.
# Crashes, missing data (insufficient_data) and upload failures are red.
# Each job writes a summary row; the last job lists every model in one table.
# Requires the same secrets as nba-train-props.yml (RAILWAY_TOKEN, AWS_*).

on:
  schedule:
    - cron: "0 11 * * 1" # Mondays 11:00 UTC, after the 3:30 ET pipeline is done
  workflow_dispatch:

jobs:
  retrain:
    name: Retrain NBA ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1 # one heavy read of the production DB at a time
      matrix:
        model: [spread, points, rebounds, assists, residual_rebounds, residual_assists]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Train and upload if the gate passes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POSTGRES_SERVICE_ID: 421f0104-94c9-478a-8f11-d19955df0d37
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          MODEL: ${{ matrix.model }}
        run: |
          set -uo pipefail
          export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
          # League year starts in October; train on the previous and current ones.
          month=$(date -u +%m); year=$(date -u +%Y)
          if [ "$((10#$month))" -ge 10 ]; then season=$year; else season=$((year - 1)); fi
          START="$((season - 1))-10-01"; END="$(date -u +%F)"
          echo "window $START .. $END"
          if [ "$MODEL" = "spread" ]; then
            scripts/retrain_step.sh "$MODEL" python3 -m app.services.etl.nba.ml_training.train_spread_model \
              --start "$START" --end "$END" --upload
          elif [ "${MODEL#residual_}" != "$MODEL" ]; then
            scripts/retrain_step.sh "$MODEL" python3 -m app.services.etl.nba.residual train --stat "${MODEL#residual_}" \
              --start "$START" --end "$END" --upload
          else
            scripts/retrain_step.sh "$MODEL" python3 -m app.services.etl.nba.ml_training \
              --stat "$MODEL" --start "$START" --end "$END" --upload
          fi

      - name: Upload summary row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-summary-${{ matrix.model }}
          path: backend/summary-${{ matrix.model }}.json
          if-no-files-found: ignore

  summary:
    name: Summary table
    needs: retrain
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          pattern: retrain-summary-*
          merge-multiple: true
          path: summaries

      - name: Write summary table
        run: |
          shopt -s nullglob
          python3 backend/scripts/retrain_summary.py table \
            --expect spread,points,rebounds,assists,residual_rebounds,residual_assists \
            summaries/*.json >> "$GITHUB_STEP_SUMMARY"
