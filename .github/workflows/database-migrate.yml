name: Database Migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: Railway target (production or staging)
        required: true
        type: choice
        options:
          - production
          - staging
      refresh_mlb_strikeouts:
        description: After migrate, rebuild pred_pitcher and archive K projections
        required: false
        type: boolean
        default: false

jobs:
  migrate:
    name: Alembic upgrade (${{ inputs.target }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Run migrations (production)
        if: inputs.target == 'production'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # Optional override; default discovers Postgres service by name.
          POSTGRES_SERVICE_ID: 421f0104-94c9-478a-8f11-d19955df0d37
        run: |
          set -euo pipefail
          export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
          echo "DATABASE_URL resolved (host only): ${DATABASE_URL#*@}"
          echo "=== Before ==="
          alembic current
          python3 scripts/reconcile_wnba_alembic.py
          echo "=== Upgrade ==="
          alembic upgrade heads
          echo "=== After ==="
          alembic current
          python3 <<'PY'
          import os
          from sqlalchemy import create_engine, text
          e = create_engine(os.environ["DATABASE_URL"])
          with e.connect() as c:
              rev = c.execute(text("SELECT version_num FROM alembic_version")).scalar()
              n = c.execute(text(
                  "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'pred_wnba_%'"
              )).scalar()
              print("alembic_version:", rev)
              print("pred_wnba_* tables:", n)
          PY

      - name: Refresh MLB strikeouts (production)
        if: inputs.target == 'production' && inputs.refresh_mlb_strikeouts
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POSTGRES_SERVICE_ID: 421f0104-94c9-478a-8f11-d19955df0d37
          CELERY_SERVICE_ID: 9b9982f4-82b7-4e0f-88a0-3212221fecf4
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
          export ODDS_API_KEY="$(python3 scripts/resolve_railway_variable.py ODDS_API_KEY)"
          echo "DATABASE_URL resolved (host only): ${DATABASE_URL#*@}"
          echo "ODDS_API_KEY present: $([ -n "${ODDS_API_KEY:-}" ] && echo yes || echo no)"
          PYTHONPATH=. python3 scripts/prod_mlb_strikeout_refresh.py

      - name: Run migrations (staging)
        if: inputs.target == 'staging'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          # Staging project: auto-discover Postgres service (no hardcoded id).
        run: |
          set -euo pipefail
          export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
          echo "DATABASE_URL resolved (host only): ${DATABASE_URL#*@}"
          echo "=== Before ==="
          alembic current
          python3 scripts/reconcile_wnba_alembic.py
          echo "=== Upgrade ==="
          alembic upgrade heads
          echo "=== After ==="
          alembic current
