name: Database Migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: Railway target (production or staging)
        required: true
        type: choice
        options:
          - production
          - staging

jobs:
  migrate:
    name: Alembic upgrade (${{ inputs.target }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Run migrations (production)
        if: inputs.target == 'production'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: 9fe8f0dc-96ac-408f-9960-950768e6eb49
        run: |
          set -euo pipefail
          export DATABASE_URL="$(python3 <<'PY'
          import json, os, subprocess, sys
          sid = os.environ["SERVICE_ID"]
          proc = subprocess.run(
              ["railway", "variable", "list", "--service", sid, "--json"],
              capture_output=True,
              text=True,
              check=True,
          )
          data = json.loads(proc.stdout)
          if isinstance(data, dict):
              url = data.get("DATABASE_PUBLIC_URL") or data.get("DATABASE_URL")
          else:
              mapping = {item["name"]: item["value"] for item in data}
              url = mapping.get("DATABASE_PUBLIC_URL") or mapping.get("DATABASE_URL")
          if not url:
              print("DATABASE_PUBLIC_URL/DATABASE_URL not found in Railway variables", file=sys.stderr)
              sys.exit(1)
          if "railway.internal" in url:
              print("Only internal DATABASE_URL found; set DATABASE_PUBLIC_URL on the Postgres service", file=sys.stderr)
              sys.exit(1)
          print(url, end="")
          PY
          )"
          echo "DATABASE_URL resolved (host only): ${DATABASE_URL#*@}"
          echo "=== Before ==="
          alembic current
          echo "=== Upgrade ==="
          alembic upgrade head
          echo "=== After ==="
          alembic current
          python3 <<'PY'
          import os
          from sqlalchemy import create_engine, text
          e = create_engine(os.environ["DATABASE_URL"])
          with e.connect() as c:
              n = c.execute(text(
                  "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'pred_wnba_%'"
              )).scalar()
              print("pred_wnba_* tables:", n)
          PY

      - name: Run migrations (staging)
        if: inputs.target == 'staging'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          SERVICE_ID: 9fe8f0dc-96ac-408f-9960-950768e6eb49
        run: |
          set -euo pipefail
          export DATABASE_URL="$(python3 <<'PY'
          import json, os, subprocess, sys
          sid = os.environ["SERVICE_ID"]
          proc = subprocess.run(
              ["railway", "variable", "list", "--service", sid, "--json"],
              capture_output=True,
              text=True,
              check=True,
          )
          data = json.loads(proc.stdout)
          if isinstance(data, dict):
              url = data.get("DATABASE_PUBLIC_URL") or data.get("DATABASE_URL")
          else:
              mapping = {item["name"]: item["value"] for item in data}
              url = mapping.get("DATABASE_PUBLIC_URL") or mapping.get("DATABASE_URL")
          if not url:
              print("DATABASE_PUBLIC_URL/DATABASE_URL not found in Railway variables", file=sys.stderr)
              sys.exit(1)
          if "railway.internal" in url:
              print("Only internal DATABASE_URL found; set DATABASE_PUBLIC_URL on the Postgres service", file=sys.stderr)
              sys.exit(1)
          print(url, end="")
          PY
          )"
          echo "DATABASE_URL resolved (host only): ${DATABASE_URL#*@}"
          echo "=== Before ==="
          alembic current
          echo "=== Upgrade ==="
          alembic upgrade head
          echo "=== After ==="
          alembic current
