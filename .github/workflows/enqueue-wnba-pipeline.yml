name: Enqueue WNBA pipeline

on:
  workflow_dispatch:

jobs:
  enqueue:
    name: Enqueue run_wnba_update_pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Enqueue WNBA daily pipeline
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          CELERY_SERVICE_ID: 9b9982f4-82b7-4e0f-88a0-3212221fecf4
          API_SERVICE_ID: 9fe8f0dc-96ac-408f-9960-950768e6eb49
        run: |
          set -euo pipefail
          if REDIS_URL="$(python3 scripts/resolve_redis_public_url.py 2>/dev/null)"; then
            export REDIS_URL
            echo "Redis host: ${REDIS_URL#*@}"
          else
            echo "No public Redis URL; will try YetAI admin API"
          fi
          export YETAI_ADMIN_EMAIL="$(python3 scripts/resolve_railway_variable.py YETAI_ADMIN_EMAIL 2>/dev/null || true)"
          export YETAI_ADMIN_PASSWORD="$(python3 scripts/resolve_railway_variable.py YETAI_ADMIN_PASSWORD 2>/dev/null || true)"
          if [ -z "${YETAI_ADMIN_EMAIL:-}" ] || [ -z "${YETAI_ADMIN_PASSWORD:-}" ]; then
            export RAILWAY_SERVICE_ID="$API_SERVICE_ID"
            export YETAI_ADMIN_EMAIL="$(python3 scripts/resolve_railway_variable.py YETAI_ADMIN_EMAIL 2>/dev/null || true)"
            export YETAI_ADMIN_PASSWORD="$(python3 scripts/resolve_railway_variable.py YETAI_ADMIN_PASSWORD 2>/dev/null || true)"
          fi
          PYTHONPATH=. python3 scripts/enqueue_wnba_pipeline.py
