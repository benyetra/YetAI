name: NFL Prod QB Eval (Railway)

on:
  workflow_dispatch:
    inputs:
      season_start:
        description: Inclusive start date on pred_qb_actuals.game_date
        required: true
        default: "2023-09-01"
      season_end:
        description: Inclusive end date on pred_qb_actuals.game_date
        required: true
        default: "2026-02-15"
      force_upload:
        description: Force-upload shadow QB artifacts to S3 even if promote=false
        required: true
        type: boolean
        default: false
      backfill_pass_yds_lines:
        description: Prefetch missing historical player_pass_yds into pass_yds_lines.json before eval (2025 already committed; leave false unless refreshing)
        required: true
        type: boolean
        default: false
      backfill_seasons:
        description: Comma-separated seasons for Odds historical backfill (holdout gap is 2025)
        required: true
        default: "2025"
      backfill_max_credits:
        description: Max Odds API credits for this backfill pass
        required: true
        default: "3000"

jobs:
  eval:
    name: Prod QB residual eval (v6 market residual promote)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Match Dockerfile / backend-ci: nfl-data-py pins numpy<2; install with --no-deps
          pip install nfl-data-py==0.3.3 --no-deps
          pip install appdirs fastparquet
          python -c "import nfl_data_py; print('nfl_data_py', getattr(nfl_data_py, '__version__', 'ok'))"

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Backfill historical pass-yds lines (Odds API)
        if: ${{ inputs.backfill_pass_yds_lines == true || inputs.backfill_pass_yds_lines == 'true' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POSTGRES_SERVICE_ID: 421f0104-94c9-478a-8f11-d19955df0d37
        run: |
          set -euo pipefail
          if [ -z "${ODDS_API_KEY:-}" ]; then
            echo "ODDS_API_KEY secret missing — skipping Odds backfill"
            exit 0
          fi
          echo "Dry-run plan for seasons=${{ inputs.backfill_seasons }}"
          PYTHONPATH=. python scripts/nfl_backfill_pass_yds_odds.py \
            --seasons "${{ inputs.backfill_seasons }}" \
            --dry-run | tee /tmp/pass_yds_backfill_plan.json
          PYTHONPATH=. python scripts/nfl_backfill_pass_yds_odds.py \
            --seasons "${{ inputs.backfill_seasons }}" \
            --max-credits "${{ inputs.backfill_max_credits }}" | tee /tmp/pass_yds_backfill.json
          # Attach team_abbr from Railway actuals when possible (0 Odds credits)
          if [ -n "${RAILWAY_TOKEN:-}" ]; then
            export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
            PYTHONPATH=. python scripts/nfl_backfill_pass_yds_odds.py \
              --assign-teams \
              --seasons "${{ inputs.backfill_seasons }}" | tee /tmp/pass_yds_assign_teams.json || true
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          idx = json.loads(Path("models/nfl/pass_yds_lines.json").read_text())
          lines = idx.get("lines") or []
          from collections import Counter
          seasons = Counter(int(r.get("season") or 0) for r in lines)
          print("index_lines", len(lines), "by_season", dict(seasons))
          PY

      - name: Run nfl_prod_qb_eval.py
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POSTGRES_SERVICE_ID: 421f0104-94c9-478a-8f11-d19955df0d37
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
          echo "DATABASE_URL resolved (host only): ${DATABASE_URL#*@}"
          EXTRA=""
          if [ "${{ inputs.force_upload }}" = "true" ]; then
            EXTRA="--force-upload"
          fi
          PYTHONPATH=. python scripts/nfl_prod_qb_eval.py \
            --season-start "${{ inputs.season_start }}" \
            --season-end "${{ inputs.season_end }}" \
            $EXTRA | tee /tmp/nfl_prod_qb_eval.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("models/nfl/qb_prod_retrain_report.json").read_text())
          print("=== PROMOTE GATE ===")
          for k in (
              "status",
              "rows_total",
              "rows_train",
              "holdout",
              "model_family",
              "promote_path",
              "promote_hp_selected",
              "line_blend_w",
              "baseline_mode",
              "fit_full",
              "tier_mae",
              "ml_mae_raw",
              "mae_lift_raw",
              "ml_mae",
              "mae_lift",
              "mae_lift_vs_static_tier",
              "pass_yds_line_real_n",
              "pass_yds_line_real_rate",
              "pass_yds_line_holdout",
              "pass_yds_line_sources",
              "promote_recommended",
              "recommendation",
          ):
              print(f"{k}: {report.get(k)}")
          tm = report.get("train_metadata") or {}
          print(
              "n_train:",
              tm.get("n_train"),
              "cv_n_train:",
              tm.get("cv_n_train"),
              "fit_full_meta:",
              tm.get("fit_full"),
              "hp:",
              tm.get("promote_hp_selected"),
              "line_blend_w:",
              tm.get("line_blend_w"),
          )
          print("n_train_equals_rows_train:", tm.get("n_train") == report.get("rows_train"))
          print("promote_hp_sweep:", tm.get("promote_hp_sweep"))
          lb = report.get("line_blend") or {}
          print(
              "line_blend: selected_w=",
              lb.get("selected_w"),
              "lift=",
              lb.get("selected_lift_vs_dynamic_tier"),
              "diagnostic_best_w=",
              lb.get("diagnostic_best_w"),
              "diagnostic_lift=",
              lb.get("diagnostic_best_lift_vs_dynamic_tier"),
          )
          print("line_blend_candidates:", lb.get("candidates"))
          print("=== ABLATIONS ===")
          ab = report.get("ablations") or {}
          for name, payload in ab.items():
              if name in {"summary", "line_blend"}:
                  continue
              if isinstance(payload, dict) and "mae" in payload:
                  print(
                      f"{name}: mae={payload.get('mae')} "
                      f"lift={payload.get('mae_lift_vs_dynamic_tier')} "
                      f"w={payload.get('w')} "
                      f"hp={payload.get('promote_hp_selected')} "
                      f"ml_closer_to_line={payload.get('ml_closer_to_line_than_tier')}"
                  )
          print("summary:", ab.get("summary"))
          ou = report.get("ou_classifier") or {}
          meta = ou.get("metadata") or {}
          print("ou_status:", ou.get("status"), "acc:", meta.get("holdout_accuracy"), "brier:", meta.get("holdout_brier"))
          PY

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nfl-prod-qb-eval-ablations
          if-no-files-found: warn
          path: |
            backend/models/nfl/qb_prod_retrain_report.json
            backend/models/nfl/qb_passing_yards.pkl
            backend/models/nfl/qb_passing_yards_metadata.json
            backend/models/nfl/qb_pass_yds_ou.pkl
            backend/models/nfl/qb_pass_yds_ou_metadata.json
            backend/models/nfl/pass_yds_lines.json
            /tmp/pass_yds_backfill.json
            /tmp/pass_yds_backfill_plan.json
