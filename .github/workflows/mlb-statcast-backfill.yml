name: MLB Statcast Backfill

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season year (e.g. 2024)
        required: true
        type: number
      force:
        description: Re-download existing partitions
        required: false
        type: boolean
        default: false

jobs:
  backfill:
    name: Statcast backfill (${{ inputs.season }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run monthly backfill
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLB_STATCAST_S3_PREFIX: ${{ vars.MLB_STATCAST_S3_PREFIX }}
        run: |
          set -euo pipefail
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          PYTHONPATH=. python scripts/mlb_statcast_backfill.py \
            --season ${{ inputs.season }} \
            ${FORCE_FLAG}
