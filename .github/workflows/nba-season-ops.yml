name: NBA Season Ops

# verify: read-only prod check (roster vs ESPN, offseason rows, misattributed ids).
# enqueue-pipeline: queue run_nba_update_pipeline on the celery worker.
# backfill-spread-actuals: ESPN final scores -> pred_nba_spread_actuals
#   (dry run unless apply is checked).
# refresh-roster-projections: update_team_roster + totals/spread projectors run
#   from the runner against prod (no worker deploy needed).
# Same secrets/services as enqueue-wnba-pipeline.yml and nba-train-props.yml.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        required: true
        type: choice
        options:
          - verify
          - enqueue-pipeline
          - backfill-spread-actuals
          - refresh-roster-projections
          - debug-totals
          - backtest-totals
          - audit-props
          - slate-check
          - props-experiment
        default: verify
      start:
        description: Backfill start (YYYY-MM-DD)
        required: false
        default: "2024-10-22"
      end:
        description: Backfill end (YYYY-MM-DD)
        required: false
        default: "2026-06-30"
      stat:
        description: Prop stat (props-experiment only)
        required: false
        default: points
      apply:
        description: Write changes (backfill only; otherwise dry run)
        required: false
        type: boolean
        default: false

jobs:
  ops:
    name: NBA ${{ inputs.action }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Verify NBA data
        if: inputs.action == 'verify'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POSTGRES_SERVICE_ID: 421f0104-94c9-478a-8f11-d19955df0d37
          DEBUG: "false"
        run: |
          set -uo pipefail
          export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
          # Non-zero exit just means verify found issues; the log is the result.
          PYTHONPATH=. python3 scripts/nba_season_rollover_repair.py verify | tee verify.log || true

      - name: Enqueue NBA daily pipeline
        if: inputs.action == 'enqueue-pipeline'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          CELERY_SERVICE_ID: 9b9982f4-82b7-4e0f-88a0-3212221fecf4
          API_SERVICE_ID: 9fe8f0dc-96ac-408f-9960-950768e6eb49
        run: |
          set -euo pipefail
          if REDIS_URL="$(python3 scripts/resolve_redis_public_url.py 2>/dev/null)"; then
            export REDIS_URL
          else
            echo "No public Redis URL; will try YetAI admin API"
          fi
          export YETAI_ADMIN_EMAIL="$(python3 scripts/resolve_railway_variable.py YETAI_ADMIN_EMAIL 2>/dev/null || true)"
          export YETAI_ADMIN_PASSWORD="$(python3 scripts/resolve_railway_variable.py YETAI_ADMIN_PASSWORD 2>/dev/null || true)"
          if [ -z "${YETAI_ADMIN_EMAIL:-}" ] || [ -z "${YETAI_ADMIN_PASSWORD:-}" ]; then
            export RAILWAY_SERVICE_ID="$API_SERVICE_ID"
            export YETAI_ADMIN_EMAIL="$(python3 scripts/resolve_railway_variable.py YETAI_ADMIN_EMAIL 2>/dev/null || true)"
            export YETAI_ADMIN_PASSWORD="$(python3 scripts/resolve_railway_variable.py YETAI_ADMIN_PASSWORD 2>/dev/null || true)"
          fi
          PYTHONPATH=. python3 scripts/enqueue_wnba_pipeline.py --sport nba

      - name: Refresh roster and re-project totals/spreads
        if: inputs.action == 'refresh-roster-projections'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POSTGRES_SERVICE_ID: 421f0104-94c9-478a-8f11-d19955df0d37
          CELERY_SERVICE_ID: 9b9982f4-82b7-4e0f-88a0-3212221fecf4
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          DEBUG: "false"
        run: |
          set -euo pipefail
          export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
          export NBA_API_KEY="$(python3 scripts/resolve_railway_variable.py NBA_API_KEY)"
          PYTHONPATH=. python3 scripts/nba_refresh_roster_projections.py

      - name: Print totals inputs (read-only)
        if: inputs.action == 'debug-totals'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POSTGRES_SERVICE_ID: 421f0104-94c9-478a-8f11-d19955df0d37
          DEBUG: "false"
        run: |
          set -euo pipefail
          export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
          PYTHONPATH=. python3 scripts/nba_totals_debug.py

      - name: Backtest totals projections (read-only)
        if: inputs.action == 'backtest-totals'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POSTGRES_SERVICE_ID: 421f0104-94c9-478a-8f11-d19955df0d37
          DEBUG: "false"
        run: |
          set -euo pipefail
          export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
          PYTHONPATH=. python3 scripts/nba_totals_backtest.py

      - name: Audit prop projections (read-only)
        if: inputs.action == 'audit-props'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POSTGRES_SERVICE_ID: 421f0104-94c9-478a-8f11-d19955df0d37
          DEBUG: "false"
        run: |
          set -euo pipefail
          export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
          PYTHONPATH=. python3 scripts/nba_props_audit.py

      - name: Check today's stored projections (read-only)
        if: inputs.action == 'slate-check'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POSTGRES_SERVICE_ID: 421f0104-94c9-478a-8f11-d19955df0d37
          DEBUG: "false"
        run: |
          set -euo pipefail
          export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
          PYTHONPATH=. python3 scripts/nba_slate_check.py

      - name: Worker log - prop line coverage and Odds API (read-only)
        if: inputs.action == 'slate-check'
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -uo pipefail
          # Only matching lines are printed; the rest of the log stays out of this run.
          timeout 240 railway logs --service 9b9982f4-82b7-4e0f-88a0-3212221fecf4 \
            --lines 20000 --since 24h > worker.log 2>&1 || true
          echo "worker.log: $(wc -l < worker.log) lines; first line: $(head -c 200 worker.log | head -1)"
          echo "== prop line coverage per generator run"
          grep -E "fanduel_line coverage" worker.log | tail -20 || true
          echo "== Odds API failures / budget blocks / NBA prop calls"
          grep -E "Odds API (events|.* odds) .*HTTP|budget blocked|get_events failed|get_event_market_odds|etl\.nba\.fanduel_lines" worker.log | tail -30 || true
          echo "== NBA pregame refresh"
          grep -E "NBA pregame refresh|nba_pregame" worker.log | tail -10 || true

      - name: Prop model experiments (read-only; caches the dataset in S3)
        if: inputs.action == 'props-experiment'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POSTGRES_SERVICE_ID: 421f0104-94c9-478a-8f11-d19955df0d37
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          DEBUG: "false"
          STAT: ${{ inputs.stat }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          set -euo pipefail
          export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
          python3 -m app.services.etl.nba.ml_training.experiments \
            --stat "$STAT" --start "$START" --end "$END"

      - name: Backfill spread actuals
        if: inputs.action == 'backfill-spread-actuals'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POSTGRES_SERVICE_ID: 421f0104-94c9-478a-8f11-d19955df0d37
          DEBUG: "false"
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          APPLY: ${{ inputs.apply && '--apply' || '' }}
        run: |
          set -euo pipefail
          export DATABASE_URL="$(python3 scripts/resolve_railway_database_url.py)"
          PYTHONPATH=. python3 scripts/nba_backfill_spread_actuals.py --from "$START" --to "$END" $APPLY

      - name: Upload verify log
        if: inputs.action == 'verify'
        uses: actions/upload-artifact@v4
        with:
          name: nba-verify-log
          path: backend/verify.log
