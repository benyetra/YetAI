name: Railway Production Deploy

on:
  workflow_dispatch:

jobs:
  deploy-api:
    name: Deploy API to Railway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      # Project token only (Project → Settings → Tokens → production environment).
      # Do NOT set RAILWAY_API_TOKEN in the same step — Railway rejects both at once.
      # No `railway link` needed: pass the API service id on `up`.
      - name: Deploy API (api.yetai.app)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --detach --service 9fe8f0dc-96ac-408f-9960-950768e6eb49

      - name: Deploy celery-worker (ETL + beat)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --detach --service 9b9982f4-82b7-4e0f-88a0-3212221fecf4

      - name: Wait for health check
        run: |
          for i in $(seq 1 36); do
            if curl -fsS https://api.yetai.app/health | grep -q '"odds_api"'; then
              echo "Production health includes odds_api diagnostics."
              curl -fsS https://api.yetai.app/health
              exit 0
            fi
            echo "Waiting for deploy... ($i/36)"
            sleep 15
          done
          echo "Timed out waiting for odds_api in /health"
          curl -fsS https://api.yetai.app/health || true
          exit 1
